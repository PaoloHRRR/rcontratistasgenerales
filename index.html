<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/2d2ebbc576.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Header -->
    <header class="sector-container">
        <div id="logo-container">
            <a href="#">
                <img src="images/logo.jpg" alt="Reaño Contratistas Generales Logo" width="250px" height="100px">
            </a>
        </div>
        <nav id="menu-container">
            <ul>
                <li><a href="#">¿Quienes somos?</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Proyectos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <!-- Photo Carousel -->
    <section id="carousel-section">
        <div class="carousel-container" id="carousel-photo-1">
            <div class="carousel-photo-container">
                <img src="images/carousel-1.jpg" alt="G">
            </div>
            <div class="arrows-container">
                <a href="#carousel-photo-3"><i class="fa-solid fa-angle-left"></i></a>
                <a href="#carousel-photo-2"><i class="fa-solid fa-angle-right"></i></a>
            </div>
        </div>
        <div class="carousel-container" id="carousel-photo-2">
            <div class="carousel-photo-container">
                <img src="images/carousel-2.jpg" alt="G">
            </div>
            <div class="arrows-container">
                <a href="#carousel-photo-1"><i class="fa-solid fa-angle-left"></i></a>
                <a href="#carousel-photo-3"><i class="fa-solid fa-angle-right"></i></a>
            </div>
        </div>
        <div class="carousel-container" id="carousel-photo-3">
            <div class="carousel-photo-container">
                <img src="images/carousel-3.jpg" alt="G">
            </div>
            <div class="arrows-container">
                <a href="#carousel-photo-2"><i class="fa-solid fa-angle-left"></i></a>
                <a href="#carousel-photo-1"><i class="fa-solid fa-angle-right"></i></a>
            </div>
        </div>
    </section>
</body>
</html>
